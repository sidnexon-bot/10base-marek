<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marek – 10men AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<style> 
  :root {
    --bg:        #111111;
    --surface:   #1a1a1a;
    --surface2:  #222222;
    --border:    #2e2e2e;
    --accent:    #EE220C;
    --accent-dim:#7a1106;
    --text:      #e8e8e8;
    --text-dim:  #888888;
    --text-muted:#555555;
    --user-bubble: #2a2a2a;
    --marek-bubble: #2a1a1a;
    --marek-accent: #4a2020;
    --sidebar-w: 260px;
    --radius:    12px;
    --radius-sm: 8px;
  }

    body.light {
    --bg:        #f2f2f7;
    --surface:   #ffffff;
    --surface2:  #f0f0f5;
    --border:    #d1d1d6;
    --text:      #1c1c1e;
    --text-dim:  #3a3a3c;
    --text-muted:#8e8e93;
    --user-bubble: #e5e5ea;
    --marek-bubble: #fde8e8;
    --marek-accent: #f5c0c0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    overflow: hidden;
    font-size: 14px;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    transition: transform 0.25s ease;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-mark svg { width: 18px; height: 18px; }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .logo-text span {
    font-style: italic;
    font-weight: 400;
    color: var(--text-dim);
    font-size: 15px;
  }
 
  #btn-new-chat {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }

  #btn-new-chat:hover {
    background: #2a2a2a;
    border-color: #3a3a3a;
  }

  #btn-new-chat svg { width: 15px; height: 15px; color: var(--text-dim); flex-shrink: 0; }

  .sidebar-section-label {
    padding: 14px 16px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
  }

  #chat-list::-webkit-scrollbar { width: 4px; }
  #chat-list::-webkit-scrollbar-track { background: transparent; }
  #chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .chat-item {
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    font-size: 13px;
    transition: background 0.12s, color 0.12s;
    position: relative;
    group: true;
  }

  .chat-item:hover { background: var(--surface2); color: var(--text); }
  .chat-item.active { background: var(--surface2); color: var(--text); }

  .chat-item svg { width: 14px; height: 14px; flex-shrink: 0; }

  .chat-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chat-item-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: opacity 0.12s, color 0.12s;
    flex-shrink: 0;
  }

  .chat-item:hover .chat-item-delete { opacity: 1; }
  .chat-item-delete:hover { color: var(--accent); }
  .chat-item-delete svg { width: 13px; height: 13px; }

  .sidebar-footer {
    padding: 12px 8px;
    border-top: 1px solid var(--border);
  }

  #user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: default;
  }

  #user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  #user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #user-avatar svg { width: 16px; height: 16px; color: var(--text); }

  #user-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #btn-logout {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.12s;
  }

  #btn-theme {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.12s;
  }
  
  #btn-theme:hover { color: var(--text); }
  #btn-theme svg { width: 15px; height: 15px; }

  #btn-logout:hover { color: var(--accent); }
  #btn-logout svg { width: 15px; height: 15px; }

  /* ── MAIN ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    will-change: transform;
  }

  /* ── TOPBAR ── */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    gap: 12px;
    flex-shrink: 0;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
  }

  #chat-title-display {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dim);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Mode toggle */
  #mode-toggle {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .mode-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 16px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .mode-btn svg { width: 13px; height: 13px; }
  .mode-btn.active { background: var(--surface); color: var(--text); }
  .mode-btn.active.internet { color: #4a9eff; }
  .mode-btn.active.safe { color: #EE220C; }

  /* ── MESSAGES ── */
  #messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }

  #messages-wrap::-webkit-scrollbar { width: 4px; }
  #messages-wrap::-webkit-scrollbar-track { background: transparent; }
  #messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  #messages {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Welcome screen */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    gap: 16px;
  }

  .welcome-avatar {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--accent-dim), #2d1a0a);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--accent-dim);
  }

  .welcome-avatar svg { width: 32px; height: 32px; color: var(--accent); }

  #welcome h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
  }

  #welcome p {
    font-size: 14px;
    color: var(--text-dim);
    max-width: 380px;
    line-height: 1.6;
  }

  .welcome-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    max-width: 480px;
  }

  .suggestion-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    font-family: 'Inter', sans-serif;
  }

  .suggestion-chip:hover {
    background: var(--surface2);
    border-color: #3a3a3a;
    color: var(--text);
  }

  /* Message bubbles */
  .msg {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
  }

  .msg.marek .msg-avatar {
    background: linear-gradient(135deg, var(--accent-dim), #1a0a05);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
  }

  .msg.marek .msg-avatar svg { width: 15px; height: 15px; }

  .msg.user .msg-avatar {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .msg.marek .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .msg.user .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.user .msg-avatar svg { width: 15px; height: 15px; }

  .msg-body { max-width: calc(100% - 50px); }

  .msg-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .msg.user .msg-name { text-align: right; }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.65;
    font-size: 14px;
    word-break: break-word;
  }

  .msg.marek .msg-bubble {
    background: var(--marek-bubble);
    border: 1px solid var(--marek-accent);
    color: var(--text);
    border-radius: var(--radius);
  }

  .msg.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
  }

  /* Markdown in bubbles */
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { font-weight: 600; color: var(--text); }
  .msg-bubble em { font-style: italic; color: var(--text-dim); }
  .msg-bubble code {
    background: #0d0d0d;
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
  }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 8px 0; }
  .msg-bubble li { margin-bottom: 4px; }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 16px;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── INPUT ── */
  #input-area {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }

  #input-wrap {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    transition: border-color 0.15s;
  }

  #input-wrap:focus-within { border-color: #3a3a3a; }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    resize: none;
    outline: none;
    max-height: 180px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  #user-input::placeholder { color: var(--text-muted); }

  #user-input::-webkit-scrollbar { width: 3px; }
  #user-input::-webkit-scrollbar-thumb { background: var(--border); }

  #btn-send {
    width: 34px;
    height: 34px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    align-self: flex-end;
  }

  #btn-send:hover { background: #cc1d0a; }
  #btn-send:active { transform: scale(0.95); }
  #btn-send:disabled { background: var(--surface2); cursor: not-allowed; }
  #btn-send svg { width: 16px; height: 16px; }

  #btn-attach {
    width: 34px;
    height: 34px;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    align-self: flex-end;
    transition: color 0.15s, background 0.15s;
  }
  #btn-attach:hover { color: var(--text); background: var(--surface2); }
  #btn-attach svg { width: 18px; height: 18px; }

  #attach-row {
    max-width: 720px;
    margin: 0 auto 8px;
    display: none;
    flex-wrap: wrap;
    gap: 6px;
  }
  #attach-row.has-items { display: flex; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text);
  }
  .chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chip .chip-state { color: var(--text-muted); flex-shrink: 0; }
  .chip.error { border-color: #7a2a22; }
  .chip.error .chip-state { color: #e0574a; }
  .chip button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
  .chip button:hover { color: var(--text); }
  .msg-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .msg-files .chip { font-size: 11px; }

  .input-hint {
    max-width: 720px;
    margin: 8px auto 0;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

    #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 200;
  }
  
  .loading-logo svg { width: 48px; height: 48px; }
  
  .loading-dot-wrap { display: flex; gap: 6px; }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 32px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .login-logo {
    width: 56px;
    height: 56px;
    background: var(--accent);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-logo svg { width: 28px; height: 28px; }

  .login-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--text);
  }

  .login-card p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  #btn-google-login {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    width: 100%;
    justify-content: center;
  }

  #btn-google-login:hover { background: #2a2a2a; border-color: #3a3a3a; }
  #btn-google-login svg { width: 18px; height: 18px; }

  /* ── ERROR TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2a1a1a;
    border: 1px solid var(--accent-dim);
    color: #ff8070;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── MOBILE ── */
  #sidebar-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    align-items: center;
  }

  #sidebar-toggle svg { width: 20px; height: 20px; }

  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 49;
  }

  @media (max-width: 700px) {
    #sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 50;
      transform: translateX(-100%);
    }

    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #sidebar-toggle { display: flex; }
  }

  /* Loading state */
  .loading-db {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 0;
  }

  .loading-db-dot {
    width: 6px; height: 6px;
    background: #4caf82;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

 <!-- LOADING SCREEN -->
<div id="loading-screen">
  <div class="loading-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#EE220C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </div>
  <div class="loading-dot-wrap">
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  </div>
</div>
 
<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-header">
    <div class="logo-row">
      <div class="logo-mark">
        <img src="icon-512.png?v=2" alt="Marek" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">
      </div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getDatabase, ref, onValue, push, set, remove, serverTimestamp, get }
  from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

// ── CONFIG ──────────────────────────────────────────────────────────
// Načti z config.js nebo vlož přímo sem
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAjDCB3gpqytTHnG7zKLKJGXMNeW5vyC_I",
  authDomain: "base-39f52.firebaseapp.com",
  databaseURL: "https://base-39f52-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "base-39f52",
  storageBucket: "base-39f52.firebasestorage.app",
  messagingSenderId: "20753597026",
  appId: "1:20753597026:web:bec0c5a784492206f3c73b"
};

// ── SYSTEM PROMPT ──
// Prompt i data skládá server (chatMarek v 10space functions). Klient posílá jen zprávy a režim.

// ── INIT ────────────────────────────────────────────────────────────
const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getDatabase(app);

// ── STATE ───────────────────────────────────────────────────────────
let currentUser   = null;
// AI volá Cloud Function chatMarek — API klíč zůstává na serveru (/gemini_config je pro klienty zavřený)
const CHAT_MAREK_URL = "https://chatmarek-etp6s2ynnq-uc.a.run.app";
const MAREK_UPLOAD_URL = "https://us-central1-base-39f52.cloudfunctions.net/marekUpload";
const MAX_UPLOAD_BYTES = 8 * 1024 * 1024;
const MAX_FILES_PER_MESSAGE = 5;
let pending = []; // přílohy čekající na odeslání: {key, name, state: "up"|"ok"|"err", id?, kind?, error?}
let currentChatId = null;
let currentMode   = 'safe'; // 'safe' | 'internet'
let messages      = [];     // [{role, content}]
let isLoading     = false;
let userPhotoURL  = null;

// ── SESSION (localStorage, stejný vzor jako 10base) ────────────────────
const SESSION_KEY = 'marek_user';

// Pokud není session, appka tu nemá co dělat — pryč na login
const sessionRaw = localStorage.getItem(SESSION_KEY);
if (!sessionRaw) {
  window.location.replace('login.html');
  throw new Error('no-session'); // zastaví běh skriptu — location.replace() sám o sobě nestačí
}
let session = null;
try {
  session = JSON.parse(sessionRaw);
} catch (e) {
  localStorage.removeItem(SESSION_KEY);
  window.location.replace('login.html');
  throw new Error('corrupt-session');
}

// ── DOM ─────────────────────────────────────────────────────────────
const $sidebar        = document.getElementById('sidebar');
const $sidebarOverlay = document.getElementById('sidebar-overlay');
const $sidebarToggle  = document.getElementById('sidebar-toggle');
const $chatList       = document.getElementById('chat-list');
const $messages       = document.getElementById('messages');
const $messagesWrap   = document.getElementById('messages-wrap');
const $welcome        = document.getElementById('welcome');
const $input          = document.getElementById('user-input');
const $btnSend        = document.getElementById('btn-send');
const $chatTitle      = document.getElementById('chat-title-display');
const $userAvatar     = document.getElementById('user-avatar');
const $userName       = document.getElementById('user-name');
const $toast          = document.getElementById('toast');

// ── AUTH ────────────────────────────────────────────────────────────
// Session (localStorage) řídí OKAMŽITÉ vykreslení appky — Firebase Auth
// běží na pozadí jen kvůli platnosti tokenu pro RTDB Rules (/membersByUid).
// Bezpečnost zajišťují RTDB Rules, ne tento klientský check.

function initMemberFromSession() {
  document.getElementById('loading-screen').style.display = 'none';

  userPhotoURL = session.photoURL;
  if (session.photoURL) {
    $userAvatar.innerHTML = `<img src="${session.photoURL}" alt="">`;
  }
  $userName.textContent = session.name || session.email;

  // POZOR: input zůstává disabled, dokud onAuthStateChanged nepotvrdí platný
  // Firebase Auth token — jinak by šlo poslat zprávu dřív, než je currentUser
  // nastavené (currentUser.uid se používá v cestách do RTDB) a appka by spadla.
  // To, co se vykreslí hned, je jen "kostra" appky (sidebar, avatar, jméno),
  // ne aktivní psaní — tím se vyhneme login/loading flashi, ale ne race condition.
}

function clearSessionAndRedirect() {
  localStorage.removeItem(SESSION_KEY);
  window.location.replace('login.html');
}

document.getElementById('btn-logout').addEventListener('click', async () => {
  localStorage.removeItem(SESSION_KEY);
  try { await signOut(auth); } catch (e) { /* ignore */ }
  window.location.replace('login.html');
});

// Vykresli appku hned ze session cache — nečekáme na Firebase Auth roundtrip
initMemberFromSession();

onAuthStateChanged(auth, user => {
  currentUser = user;

  if (!user) {
    // Firebase Auth token vypršel/byl odvolán a nepodařilo se ho obnovit
    // → appka nesmí dál běžet jen ze staré localStorage cache (viz Priorita 2:
    // "expirovaný token" byla otevřená mezera u 10base, tady ji rovnou zavíráme).
    clearSessionAndRedirect();
    return;
  }

  // Uživatel má platný Firebase Auth token → appka je bezpečně
  // aktivní, teprve teď se povolí psaní zpráv.
  $input.disabled = false;
  updateSendBtn();

  loadChatList();
});

// ── MODE TOGGLE ──────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── SIDEBAR MOBILE ───────────────────────────────────────────────────
$sidebarToggle.addEventListener('click', () => {
  $sidebar.classList.add('open');
  $sidebarOverlay.classList.add('open');
});

$sidebarOverlay.addEventListener('click', () => {
  $sidebar.classList.remove('open');
  $sidebarOverlay.classList.remove('open');
});

// ── NEW CHAT ─────────────────────────────────────────────────────────
document.getElementById('btn-new-chat').addEventListener('click', () => {
  currentChatId = null;
  messages = [];
  $messages.innerHTML = '';
  $messages.appendChild($welcome);
  $welcome.style.display = '';
  $chatTitle.textContent = 'Nový chat';
  document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
  $sidebar.classList.remove('open');
  $sidebarOverlay.classList.remove('open');
});

// ── CHAT LIST ────────────────────────────────────────────────────────
function loadChatList() {
  if (!currentUser) return;
  const chatsRef = ref(db, `marek_chats/${currentUser.uid}`);
  onValue(chatsRef, snap => {
    $chatList.innerHTML = '';
    if (!snap.exists()) return;

    const chats = [];
    snap.forEach(child => {
      chats.push({ id: child.key, ...child.val() });
    });

    // Sort by updatedAt desc
    chats.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    chats.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      item.dataset.id = chat.id;
      item.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="chat-item-title">${escHtml(chat.title || 'Chat')}</span>
        <button class="chat-item-delete" data-id="${chat.id}" title="Smazat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      `;

      item.addEventListener('click', (e) => {
        if (e.target.closest('.chat-item-delete')) return;
        loadChat(chat.id);
        $sidebar.classList.remove('open');
        $sidebarOverlay.classList.remove('open');
      });

      item.querySelector('.chat-item-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteChat(chat.id);
      });

      $chatList.appendChild(item);
    });
  });
}

async function loadChat(chatId) {
  if (!currentUser) return;
  currentChatId = chatId;
  messages = [];

  document.querySelectorAll('.chat-item').forEach(i => {
    i.classList.toggle('active', i.dataset.id === chatId);
  });

  const snap = await get(ref(db, `marek_chats/${currentUser.uid}/${chatId}`));
  if (!snap.exists()) return;

  const data = snap.val();
  $chatTitle.textContent = data.title || 'Chat';
  $welcome.style.display = 'none';
  $messages.innerHTML = '';

  if (data.messages) {
    Object.values(data.messages).forEach(msg => {
      const atts = Array.isArray(msg.attachments) ? msg.attachments : [];
      messages.push({ role: msg.role, content: msg.content, attachments: atts });
      renderMessage(msg.role === 'user' ? 'user' : 'marek', msg.content, atts);
    });
  }

  scrollToBottom();
}

async function deleteChat(chatId) {
  if (!currentUser) return;
  await remove(ref(db, `marek_chats/${currentUser.uid}/${chatId}`));
  if (currentChatId === chatId) {
    currentChatId = null;
    messages = [];
    $messages.innerHTML = '';
    $messages.appendChild($welcome);
    $welcome.style.display = '';
    $chatTitle.textContent = 'Nový chat';
  }
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 180) + 'px';
  updateSendBtn();
});

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!$btnSend.disabled) sendMessage();
  }
});

$btnSend.addEventListener('click', sendMessage);

document.querySelectorAll('.suggestion-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    $input.value = chip.dataset.text;
    $input.dispatchEvent(new Event('input'));
    sendMessage();
  });
});

function updateSendBtn() {
  const uploading = pending.some(a => a.state === 'up');
  const hasReady = pending.some(a => a.state === 'ok');
  $btnSend.disabled = isLoading || uploading || (!$input.value.trim() && !hasReady) || !currentUser;
}

// ── PŘÍLOHY ──
function chipHtml(name, state, extra = '') {
  return `<span class="chip${state === 'err' ? ' error' : ''}"><span>📎</span><span class="chip-name">${escHtml(name)}</span>${extra}</span>`;
}

function renderAttachRow() {
  const row = document.getElementById('attach-row');
  row.classList.toggle('has-items', pending.length > 0);
  row.innerHTML = pending.map(a => {
    const st = a.state === 'up' ? '<span class="chip-state">nahrávám…</span>'
             : a.state === 'err' ? `<span class="chip-state">${escHtml(a.error || 'chyba')}</span>` : '';
    return `<span class="chip${a.state === 'err' ? ' error' : ''}"><span>📎</span><span class="chip-name">${escHtml(a.name)}</span>${st}<button type="button" data-key="${a.key}" aria-label="Odebrat">✕</button></span>`;
  }).join('');
  updateSendBtn();
}

async function uploadFile(file) {
  if (pending.length >= MAX_FILES_PER_MESSAGE) { showToast(`Najednou max. ${MAX_FILES_PER_MESSAGE} příloh.`); return; }
  const item = { key: Math.random().toString(36).slice(2), name: file.name || 'soubor', state: 'up' };
  pending.push(item); renderAttachRow();
  if (file.size > MAX_UPLOAD_BYTES) { item.state = 'err'; item.error = 'větší než 8 MB'; renderAttachRow(); return; }
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${MAREK_UPLOAD_URL}?name=${encodeURIComponent(item.name)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream', 'Authorization': `Bearer ${idToken}` },
      body: file
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Nahrání se nezdařilo.');
    Object.assign(item, { state: 'ok', id: data.file.id, kind: data.file.kind, name: data.file.name });
  } catch (e) {
    item.state = 'err'; item.error = e.message;
    showToast(e.message);
  }
  renderAttachRow();
}

function addFiles(list) {
  [...list].forEach(f => uploadFile(f));
}

document.getElementById('btn-attach').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('attach-row').addEventListener('click', e => {
  const b = e.target.closest('button[data-key]'); if (!b) return;
  pending = pending.filter(a => a.key !== b.dataset.key); renderAttachRow();
});
// vložení obrázku ze schránky (např. snímek obrazovky)
$input.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); addFiles(files); }
});

async function sendMessage() {
  const atts = pending.filter(a => a.state === 'ok').map(a => ({ id: a.id, name: a.name, kind: a.kind }));
  const text = $input.value.trim() || (atts.length ? 'Přikládám soubor.' : '');
  if (!text || isLoading || !currentUser || pending.some(a => a.state === 'up')) return;
  const sentPending = pending; pending = []; renderAttachRow();

  // Hide welcome
  $welcome.style.display = 'none';

  // Add user message
  messages.push({ role: 'user', content: text, attachments: atts });
  renderMessage('user', text, atts);
  $input.value = '';
  $input.style.height = 'auto';
  isLoading = true;
  updateSendBtn();

  // Typing indicator
  const typingEl = renderTyping();
  scrollToBottom();

  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(CHAT_MAREK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${idToken}`
      },
      body: JSON.stringify({
        mode: currentMode,
        messages: messages.map(m => ({
          role: m.role === 'model' ? 'assistant' : 'user',
          content: m.content,
          ...(m.attachments?.length ? { attachments: m.attachments.map(a => a.id) } : {})
        }))
      })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Chyba API');
    const reply = data.reply || '…';

    // Remove typing, add reply
    typingEl.remove();
    messages.push({ role: 'model', content: reply });
    renderMessage('marek', reply);
    scrollToBottom();

    // Save to Firebase
    await saveChat(text, reply);

  } catch (e) {
    typingEl.remove();
    showToast('Chyba: ' + e.message);
    messages.pop(); // remove failed user msg from history
    pending = sentPending; renderAttachRow(); // přílohy zůstanou k opětovnému odeslání
  } finally {
    isLoading = false;
    updateSendBtn();
  }
}

// ── SAVE CHAT ─────────────────────────────────────────────────────────
async function saveChat(userText, replyText) {
  if (!currentUser) return;

  if (!currentChatId) {
    // New chat – create
    const chatRef = push(ref(db, `marek_chats/${currentUser.uid}`));
    currentChatId = chatRef.key;
    $chatTitle.textContent = userText.slice(0, 50);

    // Mark active in sidebar
    setTimeout(() => {
      document.querySelectorAll('.chat-item').forEach(i => {
        i.classList.toggle('active', i.dataset.id === currentChatId);
      });
    }, 300);
  }

  // Save all messages
  const chatData = {
    title: messages[0]?.content?.slice(0, 50) || 'Chat',
    updatedAt: Date.now(),
    messages: {}
  };

  messages.forEach((m, i) => {
    chatData.messages[`msg_${String(i).padStart(4, '0')}`] = {
      role: m.role,
      content: m.content,
      ...(m.attachments?.length ? { attachments: m.attachments } : {})
    };
  });

  await set(ref(db, `marek_chats/${currentUser.uid}/${currentChatId}`), chatData);
}

// ── RENDER ────────────────────────────────────────────────────────────
function renderMessage(who, text, atts = []) {
  const isUser = who === 'user';
  const div = document.createElement('div');
  div.className = `msg ${who}`;

  const avatarHtml = isUser
    ? (userPhotoURL
        ? `<img src="${userPhotoURL}" alt="">`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`)
        : `<img src="icon-192.png?v=2" alt="Marek">`;

  div.innerHTML = `
    <div class="msg-avatar">${avatarHtml}</div>
    <div class="msg-body">
      <div class="msg-name">${isUser ? (currentUser?.displayName?.split(' ')[0] || 'Ty') : 'Marek'}</div>
      <div class="msg-bubble">${formatText(text)}${atts.length ? `<div class="msg-files">${atts.map(a => chipHtml(a.name, 'ok')).join('')}</div>` : ''}</div>
    </div>
  `;

  $messages.appendChild(div);
  return div;
}

function renderTyping() {
  const div = document.createElement('div');
  div.className = 'msg marek';
  div.innerHTML = `
    <div class="msg-avatar"><img src="icon-192.png?v=2" alt="Marek"></div>
    <div class="msg-body">
      <div class="msg-name">Marek</div>
      <div class="msg-bubble">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>
  `;
  $messages.appendChild(div);
  return div;
}

function formatText(text) {
  // Basic markdown-lite
  return escHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function scrollToBottom() {
  $messagesWrap.scrollTop = $messagesWrap.scrollHeight;
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 4000);
}

// Theme toggle
  const $btnTheme = document.getElementById('btn-theme');
  const $iconDark = document.getElementById('icon-dark');
  const $iconLight = document.getElementById('icon-light');

// Načti uložené nastavení
  if (localStorage.getItem('marek_theme') === 'light') {
    document.body.classList.add('light');
    $iconDark.style.display = 'none';
    $iconLight.style.display = 'block';
  }

  $btnTheme.addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light');
    $iconDark.style.display = isLight ? 'none' : 'block';
    $iconLight.style.display = isLight ? 'block' : 'none';
    localStorage.setItem('marek_theme', isLight ? 'light' : 'dark');
  });

// iOS keyboard fix
if (/iPhone|iPad/.test(navigator.userAgent)) {
  const main = document.getElementById('main');
  
  window.visualViewport.addEventListener('resize', () => {
    const height = window.visualViewport.height;
    const offsetTop = window.visualViewport.offsetTop;
    
    main.style.position = 'fixed';
    main.style.top = offsetTop + 'px';
    main.style.left = '0';
    main.style.right = '0';
    main.style.height = height + 'px';
    
    scrollToBottom();
  });

  window.visualViewport.addEventListener('scroll', () => {
    main.style.top = window.visualViewport.offsetTop + 'px';
  });
}
  
</script>
